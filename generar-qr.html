<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generador de QR · Boda</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--rose:#f7d6df;--rose-deep:#e9a9ba;--peach:#fde3d3;--mint:#d6efe3;--lavender:#e4dcf6;--ink:#6b5560;--ink-soft:#9b8790}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Quicksand',sans-serif;color:var(--ink);background:#fffaf6;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:22px}
  .panel{width:100%;max-width:520px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(200,150,170,.18)}
  h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin:0 0 6px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input{width:100%;padding:12px 14px;border:1.5px solid #f0dfe5;border-radius:14px;font:inherit;color:var(--ink)}
  .row{display:flex;gap:10px}
  button{border:none;border-radius:999px;padding:13px 20px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#f6b9c9,#f3a6bd);margin-top:16px}
  button.alt{background:linear-gradient(135deg,#bfe3d0,#a9d6c2)}

  /* Tarjeta imprimible (papel 10x15 cm aprox.) */
  #print{
    width:420px;padding:34px 28px 30px;text-align:center;border-radius:28px;color:var(--ink);
    background:
      radial-gradient(circle at 8% 6%, var(--rose) 0, transparent 40%),
      radial-gradient(circle at 94% 10%, var(--lavender) 0, transparent 38%),
      radial-gradient(circle at 90% 94%, var(--mint) 0, transparent 40%),
      radial-gradient(circle at 6% 92%, var(--peach) 0, transparent 40%), #fffaf6;
    border:2px solid #fff;box-shadow:0 14px 40px rgba(200,150,170,.25);
  }
  #print .flower{font-size:30px}
  #print h1{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:600;margin:4px 0 2px;color:#7a5a68;line-height:1}
  #print h1 em{color:var(--rose-deep);font-weight:500}
  #print .d{letter-spacing:.24em;font-size:12px;text-transform:uppercase;color:var(--ink-soft);margin:0 0 18px}
  #print .t{font-family:'Cormorant Garamond',serif;font-size:24px;font-style:italic;margin:0 0 16px;line-height:1.25}
  #qrWrap{display:inline-block;background:#fff;padding:16px;border-radius:24px;box-shadow:0 8px 24px rgba(200,150,170,.28)}
  #qrWrap svg{display:block;width:230px;height:230px}
  #print .s{font-size:13.5px;margin:16px 0 0;color:var(--ink-soft);line-height:1.5}
  @media print{
    body{background:#fff;padding:0}
    .panel{display:none}
    #print{box-shadow:none;margin:0 auto}
    @page{margin:10mm}
  }
</style>
</head>
<body>
  <div class="panel">
    <h2>Generador del código QR</h2>
    <p style="margin:0;font-size:14px;color:var(--ink-soft)">Escribe la dirección de tu página de GitHub Pages y descarga o imprime la tarjeta.</p>
    <label for="url">Dirección de la página de fotos</label>
    <input id="url" type="url" placeholder="https://tuusuario.github.io/boda/">
    <div class="row">
      <div style="flex:1"><label for="n1">Novia/o 1</label><input id="n1" value="Tania"></div>
      <div style="flex:1"><label for="n2">Novia/o 2</label><input id="n2" value="Deiber"></div>
    </div>
    <label for="fecha">Fecha</label>
    <input id="fecha" value="05 · 12 · 2026">
    <div class="row">
      <button id="bPrint">🖨️ Imprimir</button>
      <button id="bPng" class="alt">⬇️ Descargar PNG</button>
    </div>
  </div>

  <div id="print">
    <div class="flower">🌸</div>
    <h1><span id="p1">Tania</span> <em>&amp;</em> <span id="p2">Deiber</span></h1>
    <p class="d" id="pd">05 · 12 · 2026</p>
    <p class="t">Comparte tus fotos<br>de este día tan especial</p>
    <div id="qrWrap"></div>
    <p class="s">Escanea el código con la cámara de tu celular<br>y sube tus fotos 📷</p>
  </div>

<script src="qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);
const guess = location.protocol.startsWith('http') && !location.pathname.endsWith('generar-qr.html') ? location.href
  : location.protocol.startsWith('http') ? location.href.replace(/generar-qr\.html.*$/, '') : '';
$('url').value = guess;

function update(){
  $('p1').textContent = $('n1').value; $('p2').textContent = $('n2').value; $('pd').textContent = $('fecha').value;
  const u = $('url').value.trim();
  if(!u){ $('qrWrap').innerHTML = '<div style="width:230px;height:230px;display:grid;place-items:center;color:#bbb;font-size:13px">Escribe la dirección</div>'; return; }
  const qr = qrcode(0,'M'); qr.addData(u); qr.make();
  $('qrWrap').innerHTML = qr.createSvgTag({cellSize:6, margin:0, scalable:true});
}
['url','n1','n2','fecha'].forEach(id=>$(id).addEventListener('input',update));
update();

$('bPrint').onclick = () => window.print();

// Descarga PNG dibujando la tarjeta en un canvas
$('bPng').onclick = async () => {
  if(!$('url').value.trim()) return alert('Primero escribe la dirección de tu página.');
  try { await document.fonts.ready; } catch(e){}
  const S = 3, W = 420, H = 620, c = document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const x = c.getContext('2d'); x.scale(S,S);
  x.fillStyle = '#fffaf6'; x.fillRect(0,0,W,H);
  [[0.08,0.06,'#f7d6df'],[0.94,0.10,'#e4dcf6'],[0.90,0.94,'#d6efe3'],[0.06,0.92,'#fde3d3']].forEach(([a,b,col])=>{
    const g = x.createRadialGradient(W*a,H*b,0,W*a,H*b,190); g.addColorStop(0,col); g.addColorStop(1,col+'00');
    x.fillStyle=g; x.fillRect(0,0,W,H);
  });
  x.textAlign='center'; x.fillStyle='#7a5a68';
  x.font='30px serif'; x.fillText('🌸', W/2, 62);
  x.font='600 46px "Cormorant Garamond", serif';
  const a=$('n1').value, b=$('n2').value;
  x.fillText(`${a} & ${b}`, W/2, 122);
  x.fillStyle='#9b8790'; x.font='500 12px Quicksand, sans-serif';
  x.letterSpacing='3px'; x.fillText($('fecha').value.toUpperCase(), W/2, 148); x.letterSpacing='0px';
  x.fillStyle='#6b5560'; x.font='italic 500 24px "Cormorant Garamond", serif';
  x.fillText('Comparte tus fotos', W/2, 192); x.fillText('de este día tan especial', W/2, 220);
  // QR
  const qr = qrcode(0,'M'); qr.addData($('url').value.trim()); qr.make();
  const n = qr.getModuleCount(), box = 262, pad = 16, size = box-pad*2, qx=(W-box)/2, qy=240;
  x.fillStyle='#fff'; x.shadowColor='rgba(200,150,170,.3)'; x.shadowBlur=18; x.shadowOffsetY=6;
  roundRect(x,qx,qy,box,box,24); x.fill(); x.shadowColor='transparent';
  const cell = size/n; x.fillStyle='#5a4650';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++) if(qr.isDark(r,k)) x.fillRect(qx+pad+k*cell, qy+pad+r*cell, cell+.4, cell+.4);
  x.fillStyle='#9b8790'; x.font='500 13.5px Quicksand, sans-serif';
  x.fillText('Escanea el código con la cámara de tu celular', W/2, 538);
  x.fillText('y sube tus fotos 📷', W/2, 560);
  const l=document.createElement('a'); l.download='qr-fotos-boda.png'; l.href=c.toDataURL('image/png'); l.click();
};
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
</script>
</body>
</html>
